<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sergio.gg@usal — interactive terminal</title>
<meta name="description" content="Sergio García — PhD student · Robotics & AI. Interactive terminal profile.">
<style>
  :root{
    --bg:#030712; --panel:#0F172A; --border:rgba(255,255,255,.08);
    --text:#F8FAFC; --muted:#94A3B8;
    --a1:#7C3AED; --a2:#22D3EE; --a3:#10B981;
  }
  [data-theme="light"]{
    --bg:#FFFFFF; --panel:#F8FAFC; --border:rgba(15,23,42,.08);
    --text:#0F172A; --muted:#475569;
    --a1:#2563EB; --a2:#06B6D4; --a3:#10B981;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
    display:flex; align-items:center; justify-content:center;
    padding:24px; transition:background .4s;
    background-image:
      radial-gradient(600px 400px at 15% 10%, color-mix(in srgb, var(--a1) 14%, transparent), transparent),
      radial-gradient(500px 350px at 85% 15%, color-mix(in srgb, var(--a2) 10%, transparent), transparent),
      radial-gradient(600px 400px at 50% 100%, color-mix(in srgb, var(--a3) 8%, transparent), transparent);
  }
  .wrap{
    display:grid; grid-template-columns: 420px 1fr; gap:22px;
    width:min(1180px,100%); height:min(640px,92vh);
  }
  @media (max-width:900px){
    .wrap{grid-template-columns:1fr; height:auto;}
    .left{min-height:380px;}
  }
  .panel{
    background:color-mix(in srgb, var(--panel) 72%, transparent);
    border:1px solid var(--border); border-radius:18px;
    backdrop-filter:blur(14px); overflow:hidden; position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  /* ---- left: ascii portrait ---- */
  .left{display:flex; flex-direction:column;}
  .plabel{padding:14px 20px; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--a3); animation:blink 2s infinite;}
  @keyframes blink{50%{opacity:.25}}
  .ascii-box{flex:1; display:flex; align-items:center; justify-content:center; padding:0 10px 16px;}
  pre.ascii{
    font-size:5.6px; line-height:1.08; letter-spacing:0; white-space:pre; cursor:pointer;
    background:linear-gradient(120deg,var(--a2),var(--a1),var(--a3),var(--a2));
    background-size:300% 300%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:grad 9s ease infinite, floaty 6s ease-in-out infinite;
    filter:drop-shadow(0 0 6px color-mix(in srgb, var(--a2) 55%, transparent));
    transition:transform .3s, filter .3s;
    user-select:none;
  }
  pre.ascii:hover{transform:scale(1.03); filter:drop-shadow(0 0 14px var(--a2));}
  @keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -6px}}
  .scan{position:absolute; left:0; right:0; height:70px; pointer-events:none;
    background:linear-gradient(to bottom,transparent,color-mix(in srgb, var(--a2) 7%, transparent),transparent);
    animation:sweep 6s linear infinite;}
  @keyframes sweep{0%{top:-80px}100%{top:110%}}
  /* ---- right: terminal ---- */
  .right{display:flex; flex-direction:column;}
  .tbar{display:flex; align-items:center; gap:7px; padding:13px 18px; border-bottom:1px solid var(--border);}
  .tb{width:11px; height:11px; border-radius:50%;}
  .tb.r{background:#FF5F57}.tb.y{background:#FEBC2E}.tb.g{background:#28C840}
  .ttitle{flex:1; text-align:center; font-size:12px; color:var(--muted);}
  .langbtn{
    background:transparent; border:1px solid var(--border); border-radius:8px;
    color:var(--muted); font:inherit; font-size:11px; padding:3px 10px; cursor:pointer;
    transition:color .2s, border-color .2s;
  }
  .langbtn:hover{color:var(--a2); border-color:var(--a2);}
  .term{flex:1; overflow-y:auto; padding:18px 22px; font-size:14px; line-height:1.65;}
  .term::-webkit-scrollbar{width:8px}
  .term::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px}
  .line .p{color:var(--a3);}
  .line .cmd{color:var(--text);}
  .out{color:var(--muted); white-space:pre-wrap; word-break:break-word;}
  .out a{color:var(--a2); text-decoration:none;}
  .out a:hover{text-decoration:underline;}
  .out .hl{color:var(--text); font-weight:600;}
  .out .acc{color:var(--a2);}
  .out .acc2{color:var(--a1);}
  .grad-txt{background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));
    -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700;}
  .greet{font-size:30px; color:var(--text); font-weight:700; letter-spacing:-.5px;}
  .greet .grad-txt{font-size:34px;}
  .langpick a{margin-right:14px; font-size:15px;}
  .inrow{display:flex; align-items:center; gap:8px; padding:0 22px 18px;}
  .inrow .p{color:var(--a3);}
  .inrow input{
    flex:1; background:transparent; border:none; outline:none; color:var(--text);
    font:inherit; font-size:14px; caret-color:var(--a2);
  }
  .pill{display:inline-block; margin:3px 6px 3px 0; padding:3px 12px; border-radius:999px;
    border:1px solid color-mix(in srgb, var(--a2) 45%, transparent); color:var(--text); font-size:12.5px;
    transition:transform .2s, box-shadow .2s; cursor:default;}
  .pill:hover{transform:scale(1.08); box-shadow:0 0 14px color-mix(in srgb, var(--a2) 50%, transparent);}
  .cursor{display:inline-block; width:8px; height:15px; background:var(--a2); vertical-align:-2px; animation:blink 1.1s steps(1) infinite;}
  /* ---- easter eggs ---- */
  body.crt{filter:sepia(1) hue-rotate(65deg) saturate(3.5) contrast(1.05);}
  body.crt::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 2px, transparent 2px 4px);
    animation:crtflick .12s infinite;}
  @keyframes crtflick{0%,100%{opacity:.85}50%{opacity:1}}
  body.glitch{animation:shake .09s infinite;}
  body.glitch .panel{filter:invert(1) hue-rotate(120deg);}
  @keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(4px,-4px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(5px,2px)}}
  .confetti{position:fixed; top:-40px; z-index:98; pointer-events:none; font-size:18px;
    animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(108vh) rotate(720deg); opacity:.35}}
  #matrixov{position:fixed; inset:0; background:rgba(3,7,18,.94); z-index:97; display:none; cursor:pointer;}
</style>
</head>

function println(html, cls = 'out') {
  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = html;
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
  return d;
}
function echo(cmd) {
  println(`<span class="p">$</span> <span class="cmd">${cmd.replace(/</g,'&lt;')}</span>`, 'line');
}
async function run(cmd) {
  const trimmed = cmd.trim();
  if (/^rm\s+-(rf|fr)\s*\/*\s*$/i.test(trimmed)) { await rmEgg(); return; }
  const parts = trimmed.split(/\s+/);
  let key = (parts[0] || '').toLowerCase();
  key = ALIAS[key] || key;
  const fn = COMMANDS[key];
  if (!fn) { println(t().notFound(cmd.replace(/</g,'&lt;'))); return; }
  const out = await fn(parts.slice(1).join(' '));
  if (out !== null) println(out);
}

// portrait easter egg: scramble & rebuild
const asciiEl = document.getElementById('ascii');
let scrambling = false;
asciiEl.addEventListener('click', () => {
  if (scrambling) return;
  scrambling = true;
  const chars = '@%#*+=-:. ';
  let i = 0;
  const iv = setInterval(() => {
    asciiEl.textContent = ASCII.split('').map(c =>
      c === '\n' || c === ' ' ? c : (Math.random() < i / 12 ? c : chars[Math.random() * chars.length | 0])
    ).join('');
    if (++i > 12) { clearInterval(iv); asciiEl.textContent = ASCII; scrambling = false; }
  }, 70);
});

const mo = document.getElementById('matrixov');
const mcanvas = mo.querySelector('canvas');
let mAnim = null;
function startMatrix() {
  mo.style.display = 'block';
  mcanvas.width = innerWidth; mcanvas.height = innerHeight;
  const ctx = mcanvas.getContext('2d');
  const cols = Math.floor(innerWidth / 14);
  const drops = Array.from({length: cols}, () => Math.random() * -40);
  const glyphs = 'アイウエオカキクケコサシスセソ01@#%*+=$';
  (function step() {
    ctx.fillStyle = 'rgba(3,7,18,.08)'; ctx.fillRect(0, 0, mcanvas.width, mcanvas.height);
    ctx.font = '14px monospace';
    for (let i = 0; i < cols; i++) {
      ctx.fillStyle = Math.random() < .08 ? '#B7FFE3' : '#10B981';
      ctx.fillText(glyphs[Math.random() * glyphs.length | 0], i * 14, drops[i] * 16);
      drops[i] = drops[i] * 16 > mcanvas.height && Math.random() > .975 ? 0 : drops[i] + 1;
    }
    mAnim = requestAnimationFrame(step);
  })();
}
function stopMatrix() {
  if (mAnim) cancelAnimationFrame(mAnim);
  mAnim = null; mo.style.display = 'none'; input.focus();
}
mo.addEventListener('click', stopMatrix);
addEventListener('keydown', e => { if (e.key === 'Escape') stopMatrix(); });

const KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];

  if (kbuf.length === 10 && KONAMI.every((k, i) => kbuf[i] === k)) {

    println(document.body.classList.contains('crt')
      ? '<span class="acc">CRT mode ON</span> — 1985 vibes 📺'
      : '<span class="acc">CRT mode OFF</span>');
  }
});

function confettiRain() {
  const chars = ['🎉', '🎂', '✦', '＊', '#', '@', '%'];
  const colors = ['#7C3AED', '#22D3EE', '#10B981', '#FEBC2E'];
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = chars[Math.random() * chars.length | 0];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.color = colors[i % 4];
    s.style.animationDuration = (3 + Math.random() * 4) + 's';
    s.style.animationDelay = (Math.random() * 2) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

}

async function typeCmd(cmd, delay = 55) {
  const l = println(`<span class="p">$</span> <span class="cmd"></span><span class="cursor"></span>`, 'line');

  for (const ch of cmd) { span.textContent += ch; await new Promise(r => setTimeout(r, delay)); }
  l.querySelector('.cursor').remove();
}
